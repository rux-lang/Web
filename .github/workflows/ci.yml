name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# A follow-up push to the same branch (or PR) supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Every run builds exactly what production serves, so `verify` checks the
      # deployed files rather than a near copy. The Cloudflare preset differs
      # from `static` in two ways that ship: it appends Nuxt's route-rule cache
      # headers for /_nuxt/* to `_headers`, and a `/* /404.html 404` fallback to
      # `_redirects`. It also writes to `dist/` instead of `.output/public`.
      - name: Generate static site
        run: npm run generate:hosting
        env:
          NITRO_PRESET: cloudflare-pages-static
          NUXT_PUBLIC_API_BASE_URL: https://api.rux-lang.dev
          RUX_SITE_ORIGIN: https://rux-lang.dev
          RUX_SITEMAP_API_BASE_URL: https://api.rux-lang.dev
      # The verify scripts read `.output/public`, the `static` preset's output;
      # locally Nuxt links `dist` the other way round.
      - name: Link the output for the verify gates
        run: mkdir -p .output && ln -s ../dist .output/public
      - name: Verify generated site
        run: npm run verify
      - name: Upload the site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # Production is a Direct Upload Pages project: Cloudflare never builds or
  # installs anything, it only receives the folder `web` built and verified.
  # Needs the CLOUDFLARE_API_TOKEN secret (Account › Cloudflare Pages › Edit),
  # the CLOUDFLARE_ACCOUNT_ID secret and the CLOUDFLARE_PAGES_PROJECT variable.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://rux-lang.dev
    steps:
      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Cloudflare Pages installs with its own npm 10.9.2, while this runner has
      # npm 11. The two resolve optional peers differently, so a lock written by
      # a newer npm can pass every step here and still kill the deploy at
      # `npm clean-install`. A package flagged "extraneous" loses its "optional"
      # flag, which turns a foreign-platform binary into a required install.
      - name: Check lock against Cloudflare's npm
        run: |
          if grep -q '"extraneous": true' package-lock.json; then
            echo "::error file=package-lock.json::The lock contains extraneous entries; regenerate it with npm 10.9.2."
            exit 1
          fi
          npx -y npm@10.9.2 ci --dry-run --ignore-scripts
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=high
      - name: Test supply-chain tooling
        run: npm run supply-chain:test
