name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

# A follow-up push to the same branch (or PR) supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Generate static site
        run: npm run generate
      - name: Verify generated site
        run: npm run verify

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm writes "extraneous" instead of "optional" for a package left in
      # node_modules but unreachable from the graph, which turns a
      # foreign-platform binary into a required install: `npm ci` on this
      # Linux runner, and in deploy.yml, then dies with EBADPLATFORM.
      - name: Check lock for extraneous entries
        run: |
          if grep -q '"extraneous": true' package-lock.json; then
            echo "::error file=package-lock.json::The lock contains extraneous entries; regenerate it from a clean tree."
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=high
      - name: Test supply-chain tooling
        run: npm run supply-chain:test
