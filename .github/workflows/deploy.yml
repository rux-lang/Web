# Builds rux-lang.dev and deploys it to Cloudflare Pages. Only `main` is
# deployed; `dev` and pull requests are checked by ci.yml and never published.
# Repository secrets: CLOUDFLARE_API_TOKEN (Account › Pages › Edit), CLOUDFLARE_ACCOUNT_ID.
# Repository variable: CLOUDFLARE_PAGES_PROJECT (the Direct Upload project, "rux-lang").
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
      - "test/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pr.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes the deploy in flight; a Pages deployment only
# goes live once its upload completes, so a cancelled one changes nothing.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A manual run can be started from any branch; only main may reach
    # production, so a dispatch from dev or a feature branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://rux-lang.dev
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # The Cloudflare preset differs from `static` in two ways that ship: it
      # appends Nuxt's route-rule cache headers for /_nuxt/* to `_headers`, and
      # a `/* /404.html 404` fallback to `_redirects`. It writes to `dist/`
      # instead of `.output/public`.
      - name: Generate static site
        run: npm run generate:hosting
        env:
          NITRO_PRESET: cloudflare-pages-static
          NUXT_PUBLIC_API_BASE_URL: https://api.rux-lang.dev
          RUX_SITE_ORIGIN: https://rux-lang.dev
          RUX_SITEMAP_API_BASE_URL: https://api.rux-lang.dev
      # The verify scripts read `.output/public`, the `static` preset's output;
      # locally Nuxt links `dist` the other way round. Verifying here means a
      # broken build is never uploaded, whatever ci.yml is doing in parallel.
      - name: Link the output for the verify gates
        run: mkdir -p .output && ln -s ../dist .output/public
      - name: Verify generated site
        run: npm run verify
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
